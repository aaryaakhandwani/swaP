<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — swaP</title>
<link rel="stylesheet" href="styles.css">
<style>
.payment-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.payment-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  gap: 40px;
}
.payment-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 36px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-lg);
}
.payment-plan-badge {
  display: inline-block;
  background: var(--teal-wash);
  color: var(--teal2);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 4px 12px;
  border-radius: 100px;
  margin-bottom: 20px;
}
.payment-plan-name {
  font-family: 'Syne', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.payment-plan-price {
  font-family: 'Syne', sans-serif;
  font-size: 44px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -2px;
  line-height: 1;
  margin-bottom: 4px;
}
.payment-plan-period {
  font-size: 13px;
  color: var(--text3);
  margin-bottom: 28px;
}
.payment-divider {
  height: 1px;
  background: var(--border);
  margin-bottom: 24px;
}
.payment-what-you-get {
  font-size: 12.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text3);
  margin-bottom: 14px;
}
.payment-feature {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 10px;
}
.payment-feature svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  stroke: var(--teal2);
  fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.payment-form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 36px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-lg);
}
.payment-form-title {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.4px;
}
.payment-form-sub {
  font-size: 13.5px;
  color: var(--text2);
  margin-bottom: 28px;
  line-height: 1.6;
}
.pay-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text3);
  display: block;
  margin-bottom: 7px;
}
.pay-input {
  width: 100%;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  margin-bottom: 16px;
}
.pay-input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(77,184,170,0.1);
}
.pay-input::placeholder { color: var(--text3); }
.pay-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.pay-secure-note {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 20px;
}
.pay-secure-note svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  stroke: var(--text3);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.pay-btn {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  font-family: 'DM Sans', sans-serif;
  background: var(--teal);
  color: white;
  transition: all 0.25s;
  box-shadow: var(--shadow-teal);
  letter-spacing: 0.1px;
}
.pay-btn:hover {
  background: var(--teal2);
  transform: translateY(-1px);
  box-shadow: 0 8px 28px rgba(77,184,170,0.3);
}
.pay-back {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text3);
  cursor: pointer;
  text-decoration: none;
  margin-bottom: 28px;
  transition: color 0.2s;
}
.pay-back:hover { color: var(--text2); }
.pay-powered {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 18px;
  font-size: 12px;
  color: var(--text3);
}
.pay-powered-logo {
  font-weight: 700;
  color: var(--teal2);
}
@media (max-width: 860px) {
  .payment-wrap { flex-direction: column; }
  .payment-card, .payment-form-card { max-width: 100%; }
}
@media (max-width: 480px) {
  .payment-card, .payment-form-card { padding: 28px 20px; border-radius: 16px; }
}

/* ── PREMIUM ENHANCEMENTS ── */

/* Plan summary card: teal accent top bar + soft gradient wash + glow */
.payment-card {
  border-top: 3px solid var(--teal);
  box-shadow: 0 4px 32px rgba(77,184,170,.14), 0 8px 40px rgba(0,0,0,.07);
  overflow: hidden;
  position: relative;
}
.payment-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 130px;
  background: linear-gradient(180deg, var(--teal-wash) 0%, transparent 100%);
  pointer-events: none;
  opacity: .6;
}
[data-theme="dark"] .payment-card::before { opacity: .22; }

/* Plan price: gradient text */
.payment-plan-price {
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-size: 52px;
}

/* Plan badge: add border */
.payment-plan-badge {
  border: 1px solid var(--teal-mid);
}

/* Feature rows: border-bottom between items */
.payment-feature {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  font-weight: 500;
}
.payment-feature:last-child { border-bottom: none; padding-bottom: 0; }

/* Divider: gradient fade */
.payment-divider {
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}

/* Form card: stronger shadow + tighter border */
.payment-form-card {
  border-color: var(--border2);
  box-shadow: 0 8px 40px rgba(0,0,0,.09), 0 1px 4px rgba(0,0,0,.04);
}

/* Inputs: background tint + tighter radius */
.pay-input {
  background: var(--bg);
  border-radius: 12px;
  border-color: var(--border2);
  padding: 13px 16px;
  font-size: 14.5px;
}
.pay-input:focus {
  border-color: var(--teal);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(77,184,170,.12);
}

/* Label: smaller, uppercase, tighter */
.pay-label {
  font-size: 10.5px;
  letter-spacing: .9px;
  color: var(--text3);
}

/* Secure note: pill/badge look */
.pay-secure-note {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 14px;
  color: var(--text2);
}
.pay-secure-note svg { stroke: var(--teal2); }

/* Pay button: position relative for shine + stronger shadow */
.pay-btn {
  position: relative;
  overflow: hidden;
  letter-spacing: .2px;
  padding: 16px;
  box-shadow: 0 4px 20px rgba(77,184,170,.28);
}
.pay-btn::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
  transform: skewX(-20deg);
  transition: left .5s ease;
}
.pay-btn:hover { box-shadow: 0 8px 32px rgba(77,184,170,.38); }
.pay-btn:hover::after { left: 160%; }

/* Powered by: pill style */
.pay-powered {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 6px 16px;
  margin-top: 16px;
  font-size: 12px;
}
</style>
</head>
<body class="payment-page">

<nav class="nav">
  <a href="index.html" class="logo">
    <img src="assets/logo-black.png" alt="swaP" class="logo-light" style="height:40px;width:auto;object-fit:contain;display:block;">
    <img src="assets/logo-white.png" alt="swaP" class="logo-dark"  style="height:40px;width:auto;object-fit:contain;display:none;">
  </a>
  <div class="nav-right">
    <button class="theme-toggle" title="Toggle theme"></button>
    <a href="index.html" class="nav-btn-ghost">Back to Home</a>
  </div>
</nav>

<div class="payment-wrap">

  <!-- LEFT: Plan Summary -->
  <div class="payment-card" id="plan-summary">
    <div class="payment-plan-badge" id="plan-badge">Essential</div>
    <div class="payment-plan-name" id="plan-name">Essential Plan</div>
    <div class="payment-plan-price" id="plan-price">₹49</div>
    <div class="payment-plan-period" id="plan-period">per month</div>
    <div class="payment-divider"></div>
    <div class="payment-what-you-get">What you get</div>
    <div id="plan-features"></div>
  </div>

  <!-- RIGHT: Payment Form -->
  <div class="payment-form-card">
    <a href="index.html" class="pay-back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to plans
    </a>
    <div class="payment-form-title">Complete your payment</div>
    <div class="payment-form-sub">Enter your card details below to activate your plan.</div>

    <label class="pay-label">Card number</label>
    <input class="pay-input" placeholder="1234  5678  9012  3456" maxlength="19" id="card-num" oninput="fmtCard(this)">

    <label class="pay-label">Name on card</label>

    <div class="pay-row">
      <div>
        <label class="pay-label">Expiry</label>

      </div>
      <div>
        <label class="pay-label">CVV</label>
        <input class="pay-input" placeholder="•••" type="password" maxlength="3">
      </div>
    </div>

    <div class="pay-secure-note">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Your payment is 256-bit SSL encrypted and secure.
    </div>

    <button class="pay-btn" onclick="proceedToPay()">
      Proceed to Pay &nbsp;<span id="btn-price">₹49</span>
    </button>

    <div class="pay-powered">
      Secured by&nbsp;<span class="pay-powered-logo">Razorpay</span>
    </div>
  </div>

</div>

<script src="script.js"></script>
<script>
// ── PLAN DATA (with monthly / yearly pricing) ──
var plans = {
  free: {
    badge: 'Free',
    name: 'Free Plan',
    price:   { monthly: '₹0',  yearly: '₹0' },
    period:  { monthly: 'forever', yearly: 'forever' },
    btnPrice:{ monthly: 'Free', yearly: 'Free' },
    planKey: { monthly: 'free', yearly: 'free' },
    features: [
      'Pet registration with documents',
      'Pet profile with QR code',
      'Login & editable profile'
    ]
  },
  essential: {
    badge: 'Essential',
    name: 'Essential Plan',
    price:   { monthly: '₹49', yearly: '₹29' },
    period:  { monthly: 'per month', yearly: 'per month, billed yearly' },
    btnPrice:{ monthly: '₹49', yearly: '₹29' },
    planKey: { monthly: 'essential_monthly', yearly: 'essential_yearly' },
    features: [
      'Everything in Free',
      'Medical timeline',
      'KCI approved tagging'
    ]
  },
  pro: {
    badge: 'Pro',
    name: 'Pro Plan',
    price:   { monthly: '₹99', yearly: '₹79' },
    period:  { monthly: 'per month', yearly: 'per month, billed yearly' },
    btnPrice:{ monthly: '₹99', yearly: '₹79' },
    planKey: { monthly: 'pro_monthly', yearly: 'pro_yearly' },
    features: [
      'Everything in Essential',
      'Medical timeline',
      'KCI approved tagging',
      'Personalized messages'
    ]
  }
};

function renderPlan() {
  var params  = new URLSearchParams(window.location.search);
  var planId  = params.get('plan') || 'essential';
  var cycle   = (params.get('cycle') === 'yearly') ? 'yearly' : 'monthly';
  var plan    = plans[planId] || plans['essential'];

  document.getElementById('plan-badge').textContent  = plan.badge;
  document.getElementById('plan-name').textContent   = plan.name;
  document.getElementById('plan-price').textContent  = plan.price[cycle];
  document.getElementById('plan-period').textContent = plan.period[cycle];
  document.getElementById('btn-price').textContent   = plan.btnPrice[cycle];

  // Stamp plan key on button for Razorpay / backend order creation
  var payBtn = document.querySelector('.pay-btn');
  if (payBtn) payBtn.setAttribute('data-plan-key', plan.planKey[cycle]);

  var featHTML = plan.features.map(function(f) {
    return '<div class="payment-feature">'
      + '<svg viewBox="0 0 16 16"><polyline points="2 8 6 12 14 4"/></svg>'
      + f + '</div>';
  }).join('');
  document.getElementById('plan-features').innerHTML = featHTML;

  // Free plan tweaks
  if (planId === 'free') {
    document.getElementById('plan-summary').style.borderColor = 'var(--teal)';
    document.querySelector('.payment-form-sub').textContent = 'No payment required. Click below to activate your free account.';
    document.querySelectorAll('.pay-input').forEach(function(el){ el.style.display='none'; });
    document.querySelectorAll('.pay-label').forEach(function(el){ el.style.display='none'; });
    document.querySelector('.pay-secure-note').style.display = 'none';
    document.querySelector('.pay-btn').textContent = 'Activate Free Account →';
  }
}

function proceedToPay() {
  var params  = new URLSearchParams(window.location.search);
  var planId  = params.get('plan') || 'essential';
  var cycle   = (params.get('cycle') === 'yearly') ? 'yearly' : 'monthly';
  var plan    = plans[planId] || plans['essential'];

  // Validate card fields (skip for free plan)
  if (planId !== 'free') {
    var cardNum = (document.getElementById('card-num') || {}).value || '';
    var expiry  = (document.getElementById('expiry')   || {}).value || '';
    if (cardNum.replace(/\s/g,'').length < 16 || expiry.length < 4) {
      swapToast('Please fill in your card details.', 'error');
      return;
    }
  }

  // Disable button while "processing"
  var btn = document.querySelector('.pay-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Processing\u2026'; }

  // Simulate async payment (replace with real Razorpay call)
  setTimeout(function() {
    var planKey = plan.planKey[cycle];
    var planLabel = plan.name;

    // Persist activation signal for dashboard
    try {
      localStorage.setItem('swap-plan-activated', JSON.stringify({
        planId:    planId,
        planKey:   planKey,
        planLabel: planLabel,
        cycle:     cycle,
        ts:        Date.now()
      }));
    } catch(e) {}

    // Show success toast (visible before redirect)
    swapToast(planLabel + ' activated successfully!', 'success', 3500);

    // Redirect to dashboard after brief delay so toast is seen
    setTimeout(function() {
      window.location.href = 'dashboard.html';
    }, 1400);
  }, 900);
}

function fmtCard(el) {
  var v = el.value.replace(/\D/g,'').substring(0,16);
  el.value = v.replace(/(\d{4})(?=\d)/g,'$1  ');
}

function fmtExpiry(el) {
  var v = el.value.replace(/\D/g,'').substring(0,4);
  if (v.length >= 2) v = v.substring(0,2) + ' / ' + v.substring(2);
  el.value = v;
}
