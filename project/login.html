<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — swaP</title>
<link rel="stylesheet" href="styles.css">
<style>
.login-bg{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:48px 44px;width:100%;max-width:460px;box-shadow:var(--shadow-lg)}
.login-logo{display:flex;justify-content:center;margin-bottom:30px}
.auth-heading{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:var(--text);text-align:center;margin-bottom:6px;letter-spacing:-.5px}
.auth-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:28px;line-height:1.7}
.google-btn{width:100%;padding:13px 20px;border:1.5px solid var(--border2);border-radius:12px;background:var(--surface);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .22s;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;margin-bottom:20px}
.google-btn:hover{border-color:var(--teal);background:var(--teal-wash);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.divider{display:flex;align-items:center;gap:12px;margin:4px 0 20px}
.divider-line{flex:1;height:1px;background:var(--border)}
.divider-text{font-size:12px;color:var(--text3);font-weight:500;white-space:nowrap}
.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:border-color .2s;outline:none}
.form-field input:focus{border-color:var(--teal)}
.auth-btn{width:100%;padding:14px;background:var(--teal);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .25s;box-shadow:var(--shadow-teal);margin-top:4px}
.auth-btn:hover{background:var(--teal2);transform:translateY(-1px)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.auth-footer{text-align:center;margin-top:20px;font-size:13.5px;color:var(--text2)}
.auth-footer a{color:var(--teal2);font-weight:600}
.error-msg{background:var(--danger-bg);border:1px solid var(--danger);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--danger);margin-bottom:16px;display:none}
.error-msg.visible{display:block}
.success-msg{background:var(--teal-wash);border:1px solid var(--teal-mid);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--teal2);margin-bottom:16px;display:none}
.success-msg.visible{display:block}
.forgot-link{text-align:right;margin-top:-8px;margin-bottom:16px}
.forgot-link a{font-size:12.5px;color:var(--text3)}
@media(max-width:500px){.login-card{padding:28px 20px}}
</style>
</head>
<body class="login-bg">

<nav class="nav">
  <a href="index.html" class="logo">
    <span style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--teal)">swaP</span>
  </a>
  <div class="nav-right">
    <button class="theme-toggle" title="Toggle theme"></button>
    <span style="font-size:13px;color:var(--text2)">New to swaP?</span>
    <a href="signup.html" class="nav-btn-primary">Get Started</a>
  </div>
</nav>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--teal)">swaP</span>
    </div>
    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-sub">Log in to manage your pet's digital vault</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- Google Login -->
    <a href="/auth/google" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </a>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or continue with email</span>
      <div class="divider-line"></div>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="forgot-link"><a href="#">Forgot password?</a></div>
      <button type="submit" class="auth-btn" id="loginBtn">Log in</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign up free</a>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
// Auto-redirect if already logged in
fetch('/auth/me',{credentials:'include'}).then(r=>r.json()).then(d=>{if(d.user)window.location.href='/dashboard.html';}).catch(()=>{});

const params=new URLSearchParams(window.location.search);
if(params.get('error')==='google_failed'){
  const m=document.getElementById('errorMsg');
  m.textContent='Google sign-in failed. Please try email or try again.';m.classList.add('visible');
}
if(params.get('registered')){
  const m=document.getElementById('successMsg');
  m.textContent='Account created successfully! Please log in.';m.classList.add('visible');
}

document.getElementById('loginForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  const errEl=document.getElementById('errorMsg');
  errEl.classList.remove('visible');
  btn.disabled=true; btn.textContent='Logging in...';

  try{
    const res=await fetch('/auth/login',{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})
    });
    const data=await res.json();
    if(res.ok&&data.success){
      btn.textContent='Redirecting...';
      window.location.href=data.redirect||'/dashboard.html';
    }else{
      errEl.textContent=data.error||'Login failed. Please try again.';
      errEl.classList.add('visible');
      btn.disabled=false; btn.textContent='Log in';
    }
  }catch{
    errEl.textContent='Connection error. Please check your internet.';
    errEl.classList.add('visible');
    btn.disabled=false; btn.textContent='Log in';
  }
});
</script>
</body>
</html>
